<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="module-cycle: before, five sibling modules use each other in cycles; after, they form layers and every arrow points down">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .small { font-size: 12px; }
    .muted { fill: #656d76; }
    .bold { font-weight: 600; }
    .canvas { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .mod { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .box { fill: none; stroke: #afb8c1; stroke-width: 1.2; }
    .private { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tree { stroke: #afb8c1; stroke-width: 1.5; fill: none; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .thin { stroke: #8c959f; stroke-width: 1.2; fill: none; }
    .bad { stroke: #cf222e; stroke-width: 1.8; fill: none; }
    .good { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .badtext { fill: #cf222e; }
    .goodtext { fill: #1a7f37; }
    .badbox { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .goodbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
    .tip-n { fill: #57606a; } .tip-t { fill: #8c959f; } .tip-b { fill: #cf222e; } .tip-g { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8d96a0; }
      .canvas { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .mod, .private { fill: #0d1117; stroke: #6e7681; }
      .box, .tree { stroke: #484f58; }
      .edge { stroke: #8d96a0; }
      .thin { stroke: #6e7681; }
      .bad { stroke: #f85149; }
      .good { stroke: #3fb950; }
      .badtext { fill: #f85149; }
      .goodtext { fill: #3fb950; }
      .badbox { fill: #3c1618; stroke: #f85149; }
      .goodbox { fill: #12261e; stroke: #3fb950; }
      .tip-n { fill: #8d96a0; } .tip-t { fill: #6e7681; } .tip-b { fill: #f85149; } .tip-g { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-n"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-t"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-g"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="799" height="319" rx="8"/>
  <rect class="panel" x="10" y="10" width="380" height="300" rx="6"/>
  <rect class="panel" x="410" y="10" width="380" height="300" rx="6"/>
  <rect class="badbox" x="22" y="20" width="64" height="22" rx="11"/>
  <text class="bold small badtext" x="54" y="35" text-anchor="middle">Before</text>
  <rect class="goodbox" x="422" y="20" width="56" height="22" rx="11"/>
  <text class="bold small goodtext" x="450" y="35" text-anchor="middle">After</text>
  <!-- Before -->
  <path class="edge" d="M221.9,98.7 L294.4,144.0" marker-end="url(#n)"/>
  <path class="edge" d="M178.1,98.7 L105.6,144.0" marker-end="url(#n)"/>
  <path class="edge" d="M293.4,174.0 L160.4,244.0" marker-end="url(#n)"/>
  <path class="edge" d="M159.2,260.0 L238.8,260.0" marker-end="url(#n)"/>
  <path class="edge" d="M287.1,160.0 L111.2,160.0" marker-end="url(#n)"/>
  <path class="edge" d="M106.6,174.0 L239.6,244.0" marker-end="url(#n)"/>
  <path class="bad" d="M277.0,246.0 L312.0,176.0" marker-end="url(#b)"/>
  <path class="bad" d="M256.0,246.0 Q200,190 200.0,101.0" marker-end="url(#b)"/>
  <rect class="mod" x="179.1" y="72.0" width="41.9" height="26" rx="5"/>
  <text class="mono" x="200.0" y="89" text-anchor="middle">api</text>
  <rect class="mod" x="288.1" y="147.0" width="63.8" height="26" rx="5"/>
  <text class="mono" x="320.0" y="164" text-anchor="middle">socket</text>
  <rect class="mod" x="241.8" y="247.0" width="56.5" height="26" rx="5"/>
  <text class="mono" x="270.0" y="264" text-anchor="middle">files</text>
  <rect class="mod" x="101.8" y="247.0" width="56.5" height="26" rx="5"/>
  <text class="mono" x="130.0" y="264" text-anchor="middle">kinds</text>
  <rect class="mod" x="51.8" y="147.0" width="56.5" height="26" rx="5"/>
  <text class="mono" x="80.0" y="164" text-anchor="middle">paths</text>
  <!-- After -->
  <path class="edge" d="M600.0,89.0 L600.0,124.0" marker-end="url(#n)"/>
  <path class="edge" d="M608.6,89.0 L670.2,189.0" marker-end="url(#n)"/>
  <path class="edge" d="M582.8,154.0 L539.7,189.0" marker-end="url(#n)"/>
  <path class="edge" d="M617.2,154.0 L660.3,189.0" marker-end="url(#n)"/>
  <path class="edge" d="M536.0,219.0 L581.7,259.0" marker-end="url(#n)"/>
  <path class="edge" d="M664.0,219.0 L618.3,259.0" marker-end="url(#n)"/>
  <rect class="mod" x="579.0" y="62.0" width="41.9" height="26" rx="5"/>
  <text class="mono" x="600.0" y="79" text-anchor="middle">api</text>
  <rect class="mod" x="568.1" y="127.0" width="63.8" height="26" rx="5"/>
  <text class="mono" x="600.0" y="144" text-anchor="middle">socket</text>
  <rect class="mod" x="491.8" y="192.0" width="56.5" height="26" rx="5"/>
  <text class="mono" x="520.0" y="209" text-anchor="middle">kinds</text>
  <rect class="mod" x="651.8" y="192.0" width="56.5" height="26" rx="5"/>
  <text class="mono" x="680.0" y="209" text-anchor="middle">paths</text>
  <rect class="mod" x="571.8" y="262.0" width="56.5" height="26" rx="5"/>
  <text class="mono" x="600.0" y="279" text-anchor="middle">files</text>
</svg>
