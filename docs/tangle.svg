<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="tangle: before, Tasks and Timers in two modules use each other; after, tick above them uses both and only Tasks uses Timers">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .small { font-size: 12px; }
    .muted { fill: #656d76; }
    .bold { font-weight: 600; }
    .canvas { fill: #ffffff; stroke: #d0d7de; }
    .panel { fill: #f6f8fa; }
    .mod { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; }
    .box { fill: none; stroke: #afb8c1; stroke-width: 1.2; }
    .private { fill: #ffffff; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .tree { stroke: #afb8c1; stroke-width: 1.5; fill: none; }
    .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
    .thin { stroke: #8c959f; stroke-width: 1.2; fill: none; }
    .bad { stroke: #cf222e; stroke-width: 1.8; fill: none; }
    .good { stroke: #1a7f37; stroke-width: 2; fill: none; }
    .badtext { fill: #cf222e; }
    .goodtext { fill: #1a7f37; }
    .badbox { fill: #ffebe9; stroke: #cf222e; stroke-width: 1.2; }
    .goodbox { fill: #dafbe1; stroke: #1a7f37; stroke-width: 1.2; }
    .tip-n { fill: #57606a; } .tip-t { fill: #8c959f; } .tip-b { fill: #cf222e; } .tip-g { fill: #1a7f37; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8d96a0; }
      .canvas { fill: #0d1117; stroke: #30363d; }
      .panel { fill: #161b22; }
      .mod, .private { fill: #0d1117; stroke: #6e7681; }
      .box, .tree { stroke: #484f58; }
      .edge { stroke: #8d96a0; }
      .thin { stroke: #6e7681; }
      .bad { stroke: #f85149; }
      .good { stroke: #3fb950; }
      .badtext { fill: #f85149; }
      .goodtext { fill: #3fb950; }
      .badbox { fill: #3c1618; stroke: #f85149; }
      .goodbox { fill: #12261e; stroke: #3fb950; }
      .tip-n { fill: #8d96a0; } .tip-t { fill: #6e7681; } .tip-b { fill: #f85149; } .tip-g { fill: #3fb950; }
    }
  </style>
  <defs>
    <marker id="n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-n"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-t"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-b"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="tip-g"/></marker>
  </defs>
  <rect class="canvas" x="0.5" y="0.5" width="799" height="319" rx="8"/>
  <rect class="panel" x="10" y="10" width="380" height="300" rx="6"/>
  <rect class="panel" x="410" y="10" width="380" height="300" rx="6"/>
  <rect class="badbox" x="22" y="20" width="64" height="22" rx="11"/>
  <text class="bold small badtext" x="54" y="35" text-anchor="middle">Before</text>
  <rect class="goodbox" x="422" y="20" width="56" height="22" rx="11"/>
  <text class="bold small goodtext" x="450" y="35" text-anchor="middle">After</text>
  <!-- Before -->
  <rect class="box" x="30" y="140" width="150" height="130" rx="6"/>
  <text class="mono muted" x="40" y="158">tasks</text>
  <rect class="box" x="210" y="140" width="150" height="130" rx="6"/>
  <text class="mono muted" x="220" y="158">timers</text>
  <path class="bad" d="M130.2,201.0 Q195,165 256.2,199.0" marker-end="url(#b)"/>
  <path class="bad" d="M259.8,229.0 Q195,265 133.8,231.0" marker-end="url(#b)"/>
  <rect class="mod" x="76.8" y="202.0" width="56.5" height="26" rx="5"/>
  <text class="mono" x="105.0" y="219" text-anchor="middle">Tasks</text>
  <rect class="mod" x="253.1" y="202.0" width="63.8" height="26" rx="5"/>
  <text class="mono" x="285.0" y="219" text-anchor="middle">Timers</text>
  <!-- After -->
  <rect class="box" x="430" y="140" width="150" height="130" rx="6"/>
  <text class="mono muted" x="440" y="158">tasks</text>
  <rect class="box" x="610" y="140" width="150" height="130" rx="6"/>
  <text class="mono muted" x="620" y="158">timers</text>
  <path class="good" d="M670.1,99.0 L527.8,199.0" marker-end="url(#g)"/>
  <path class="good" d="M689.5,99.0 L685.6,199.0" marker-end="url(#g)"/>
  <path class="edge" d="M534.2,215.0 L650.1,215.0" marker-end="url(#n)"/>
  <rect class="mod" x="476.8" y="202.0" width="56.5" height="26" rx="5"/>
  <text class="mono" x="505.0" y="219" text-anchor="middle">Tasks</text>
  <rect class="mod" x="653.1" y="202.0" width="63.8" height="26" rx="5"/>
  <text class="mono" x="685.0" y="219" text-anchor="middle">Timers</text>
  <rect class="goodbox" x="658.1" y="72.0" width="63.8" height="26" rx="5"/>
  <text class="mono goodtext" x="690.0" y="89" text-anchor="middle">tick()</text>
</svg>
