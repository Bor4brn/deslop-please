name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

# Same pin as flake.nix: 1.99.0, minimal profile, plus the components below.
jobs:
  check:
    name: fmt + clippy + test + deslop-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rust-src,rust-analyzer,clippy,rustfmt
          rustup default 1.99.0

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --release --locked

      - name: deslop-please on itself, with no allowlist
        run: cargo run --release --locked
